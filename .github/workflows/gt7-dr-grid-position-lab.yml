name: GT7 DR Grid Position Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dr-grid-position-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run DR grid position lab
        run: python src/dr_grid_position_lab.py

      - name: Save lab outputs
        run: |
          git config user.name "GT7 DR Grid Position Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dr_grid_position_lab.json reports/dr_grid_position_lab.txt
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update DR grid position lab"
            git push
          fi
