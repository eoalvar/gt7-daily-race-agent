name: GT7 Audit Brake Balance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-brake-balance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit brake balance database
        run: python src/audit_brake_balance.py

      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/brake_balance_audit.txt
          git add data/brake_balance_audit.json

          if git diff --cached --quiet; then
            echo "No brake balance audit changes."
          else
            git commit -m "Audit GT7 brake balance database"
            git push
          fi