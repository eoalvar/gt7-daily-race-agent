name: GT7 Community Transcript Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcript-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp

      - name: Show yt-dlp version
        run: |
          yt-dlp --version

      - name: Run transcript test
        run: |
          python community_transcript_test.py

      - name: Show transcript test files
        if: always()
        run: |
          echo "=========================================="
          echo "Generated transcript test files"
          echo "=========================================="

          if [ -d data/community_transcript_test ]; then
            find data/community_transcript_test -type f -maxdepth 3 -print
          else
            echo "No transcript directory created."
          fi

      - name: Upload transcript test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt7-community-transcript-test
          path: data/community_transcript_test/
          if-no-files-found: warn
          retention-days: 7