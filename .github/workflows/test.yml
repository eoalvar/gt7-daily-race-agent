name: GT7 Daily Race C

on:
  workflow_dispatch:

  schedule:
    # Daily report every day at 05:15 Sao Paulo local time
    - cron: "15 5 * * *"
      timezone: "America/Sao_Paulo"

    # Final weekly snapshot Monday at 06:50 UTC
    # 10 minutes before the official 07:00 UTC Daily Race C change
    - cron: "50 6 * * 1"
      timezone: "UTC"

permissions:
  contents: write

jobs:
  run-gt7-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run GT7 Daily Race C Agent
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_SCHEDULE" = "50 6 * * 1" ]; then
            echo "Final Monday snapshot detected."
            export FINAL_WEEKLY_SNAPSHOT=1
          else
            export FINAL_WEEKLY_SNAPSHOT=0
          fi

          python src/test_race_detector.py

      - name: Save report and snapshot
        run: |
          git config user.name "GT7 Daily Race Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/ data/

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update GT7 Daily Race C data"
            git push
          fi

      - name: Send report by email
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/send_email.py