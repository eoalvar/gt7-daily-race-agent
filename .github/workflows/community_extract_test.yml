name: GT7 Community Extract Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run community extract test
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          python community_extract_test.py

      - name: Show generated files
        if: always()
        run: |
          echo "=========================================="
          echo "Generated extract test files"
          echo "=========================================="

          if [ -d data/community_extract_test ]; then
            find data/community_extract_test -type f -maxdepth 3 -print
          else
            echo "No extract directory created."
          fi

      - name: Upload extract test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt7-community-extract-test
          path: data/community_extract_test/
          if-no-files-found: warn
          retention-days: 7