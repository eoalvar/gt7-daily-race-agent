name: GT7 Diagnose Unknown Cars

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Diagnose unknown cars
        run: python src/diagnose_unknown_cars.py

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/unknown_car_diagnostic.txt
          git add data/unknown_car_diagnostic.json
          git add data/car_names.json

          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "Diagnose GT7 unknown car mappings"
            git push
          fi