name: GT7 Relativa Formula Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relative-formula-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Relativa Formula Lab
        run: |
          python src/relative_formula_lab.py

      - name: Save study outputs
        run: |
          git config user.name "GT7 Relativa Formula Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/relative_formula_lab.json reports/relative_formula_lab.txt

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update GT7 Relativa formula lab"
            git push
          fi
