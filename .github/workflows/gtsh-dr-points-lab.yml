name: GTSH DR Points Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gtsh-dr-points-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run GTSH DR Points discovery
        run: |
          python src/gtsh_dr_points_lab.py

      - name: Save discovery outputs
        run: |
          git config user.name "GTSH DR Points Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gtsh_dr_points_lab.json reports/gtsh_dr_points_lab.txt
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update GTSH DR points discovery"
            git push
          fi
