name: GT7 PB Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: gt7-pb-watch
  cancel-in-progress: false

jobs:
  watch-pb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Check qualifying PB
        id: pb
        run: python src/pb_watch.py

      - name: Check Daily C delivery
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(TZ=America/Sao_Paulo date +%H%M)
          TODAY=$(TZ=America/Sao_Paulo date +%F)

          # Once 06:10 Sao Paulo has passed, ANY later PB Watch run may
          # recover a missing Daily C. Do not depend on GitHub landing in
          # a narrow morning window, because scheduled runs can be delayed.
          if [ "$NOW" -lt 0610 ]; then
            echo "Recovery not eligible before 06:10 Sao Paulo."
            echo "recover=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNS=$(gh run list --repo "$GH_REPO" --workflow test.yml --limit 30 --json status,conclusion,createdAt)
          SUCCESS=0
          ACTIVE=0
          while IFS=$'\t' read -r status conclusion created; do
            [ -z "$created" ] && continue
            DAY=$(TZ=America/Sao_Paulo date -d "$created" +%F)
            [ "$DAY" != "$TODAY" ] && continue
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then SUCCESS=1; fi
            if [ "$status" = "queued" ] || [ "$status" = "in_progress" ] || [ "$status" = "waiting" ] || [ "$status" = "pending" ]; then ACTIVE=1; fi
          done < <(printf '%s' "$RUNS" | jq -r '.[] | [.status, (.conclusion // ""), .createdAt] | @tsv')

          echo "Daily C success today: $SUCCESS | active: $ACTIVE"
          if [ "$SUCCESS" -eq 0 ] && [ "$ACTIVE" -eq 0 ]; then
            echo "No successful/active Daily C today. Recovery required."
            echo "recover=true" >> "$GITHUB_OUTPUT"
          else
            echo "recover=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Daily Race C
        if: steps.pb.outputs.improved == 'true' || steps.daily.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ steps.pb.outputs.improved }}" = "true" ]; then
            echo "Trigger reason: new PB | gain ${{ steps.pb.outputs.gain_ms }} ms | live rank #${{ steps.pb.outputs.live_rank }}"
          else
            echo "Trigger reason: Daily C delivery recovery"
          fi
          gh workflow run test.yml --repo "$GH_REPO" --ref main
