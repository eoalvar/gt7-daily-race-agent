name: GT7 PB Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: gt7-pb-watch
  cancel-in-progress: false

jobs:
  watch-pb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Check qualifying PB
        id: pb
        run: python src/pb_watch.py

      - name: Check Daily C delivery
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(TZ=America/Sao_Paulo date +%H%M)
          TODAY=$(TZ=America/Sao_Paulo date +%F)

          # Give the normal ~05:47 Daily C ample time to finish before
          # considering recovery. This avoids racing a slow scheduled run.
          if [ "$NOW" -lt 0700 ]; then
            echo "Recovery not eligible before 07:00 Sao Paulo."
            echo "recover=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNS=$(gh run list --repo "$GH_REPO" --workflow test.yml --limit 50 --json status,conclusion,createdAt,event)
          SUCCESS=0
          ACTIVE=0
          ATTEMPTED=0
          while IFS=$'\t' read -r status conclusion created event; do
            [ -z "$created" ] && continue
            DAY=$(TZ=America/Sao_Paulo date -d "$created" +%F)
            [ "$DAY" != "$TODAY" ] && continue
            ATTEMPTED=1
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then SUCCESS=1; fi
            if [ "$status" = "queued" ] || [ "$status" = "in_progress" ] || [ "$status" = "waiting" ] || [ "$status" = "pending" ]; then ACTIVE=1; fi
          done < <(printf '%s' "$RUNS" | jq -r '.[] | [.status, (.conclusion // ""), .createdAt, (.event // "")] | @tsv')

          echo "Daily C today: success=$SUCCESS | active=$ACTIVE | attempted=$ATTEMPTED"

          # Recovery is allowed only when there has been NO Daily C attempt
          # at all today. A failed run must not cause a new dispatch every
          # five minutes. New PB triggers remain independent below.
          if [ "$SUCCESS" -eq 0 ] && [ "$ACTIVE" -eq 0 ] && [ "$ATTEMPTED" -eq 0 ]; then
            echo "No Daily C attempt exists today. One recovery dispatch is required."
            echo "recover=true" >> "$GITHUB_OUTPUT"
          else
            echo "recover=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Daily Race C
        if: steps.pb.outputs.improved == 'true' || steps.daily.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ steps.pb.outputs.improved }}" = "true" ]; then
            echo "Trigger reason: new PB | gain ${{ steps.pb.outputs.gain_ms }} ms | live rank #${{ steps.pb.outputs.live_rank }}"
          else
            echo "Trigger reason: one-time missing Daily C recovery"
          fi
          gh workflow run test.yml --repo "$GH_REPO" --ref main
