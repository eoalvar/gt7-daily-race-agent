name: GT7 Community Collector Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  community-collector-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run community collector
        run: |
          python community_collector.py

      - name: Show community database
        run: |
          echo "========================================"
          echo "data/community_sources.json"
          echo "========================================"

          if [ -f data/community_sources.json ]; then
            cat data/community_sources.json
          else
            echo "community_sources.json was not created"
          fi

      - name: Commit community sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/community_sources.json

          if git diff --cached --quiet; then
            echo "No community source changes to commit."
          else
            git commit -m "Update GT7 community sources"
            git push
          fi