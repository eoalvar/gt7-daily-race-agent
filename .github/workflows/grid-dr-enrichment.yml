name: GT7 Grid DR Enrichment

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/grid_lobby_dr_enrichment.py'
      - 'data/grid_calibration_history.json'
      - '.github/workflows/grid-dr-enrichment.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Enrich visible grid DR points
        run: python src/grid_lobby_dr_enrichment.py

      - name: Commit enrichment
        run: |
          if git diff --quiet -- data/grid_calibration_history.json; then
            echo "No DR enrichment changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grid_calibration_history.json
          git commit -m "Enrich GT7 grid DR points"
          git push
