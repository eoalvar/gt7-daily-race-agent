name: GT7 BoP Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bop-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run GT7 BoP Lab
        run: |
          python src/bop_lab.py

      - name: Save BoP Lab results
        run: |
          git config user.name "GT7 BoP Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/bop_lab/ \
            reports/bop_lab.txt

          if git diff --cached --quiet; then
            echo "No BoP Lab changes to save."
          else
            git commit -m "Update GT7 BoP Lab data"
            git push
          fi