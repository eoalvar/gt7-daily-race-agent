name: GT7 BoP Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bop-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run GT7 Multi-Group BoP Lab
        id: run_bop_lab
        continue-on-error: true
        run: |
          python src/bop_multi_group_lab.py

      - name: Classify current track BoP
        id: run_track_classifier
        if: steps.run_bop_lab.outcome == 'success'
        continue-on-error: true
        run: |
          python src/bop_track_classifier.py

      - name: Save BoP Lab results
        if: always()
        run: |
          git config user.name "GT7 BoP Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for path in \
            data/bop_lab/ \
            reports/bop_multi_group_lab.txt \
            reports/bop_track_classifier.txt
          do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No BoP Lab changes to save."
          else
            git commit -m "Update GT7 multi-group BoP Lab data"
            git push
          fi

      - name: Report BoP Lab failure
        if: steps.run_bop_lab.outcome == 'failure'
        run: |
          echo "Multi-group BoP Lab failed. Generated diagnostic files were preserved."
          exit 1

      - name: Report track classifier failure
        if: steps.run_bop_lab.outcome == 'success' && steps.run_track_classifier.outcome == 'failure'
        run: |
          echo "BoP track classifier failed. Generated BoP Lab files were preserved."
          exit 1
