name: Build GT7 Technical Car Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-car-technical-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build technical car database
        run: |
          python src/build_car_technical_database.py

      - name: Save technical database
        run: |
          git config user.name "GT7 Daily Race Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/car_technical.json \
            data/car_technical_unresolved.json

          if git diff --cached --quiet; then
            echo "No technical database changes to save."
          else
            git commit -m "Update GT7 technical car database"
            git push
          fi