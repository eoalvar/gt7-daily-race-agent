name: GT7 Backfill History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run historical backfill
        run: python src/backfill_history.py

      - name: Save historical data
        run: |
          git config user.name "GT7 Daily Race Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No historical changes to save."
          else
            git commit -m "Backfill GT7 Daily Race C history"
            git push
          fi