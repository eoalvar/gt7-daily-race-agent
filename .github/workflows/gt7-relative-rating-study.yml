name: GT7 Relativa Rating Study

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study-relativa-rating:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run empirical Relativa rating study
        run: |
          python src/relative_rating_study.py

      - name: Save study results
        run: |
          git config user.name "GT7 Relativa Rating Study"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/relative_rating_study.json reports/relative_rating_study.txt

          if git diff --cached --quiet; then
            echo "No study changes to save."
          else
            git commit -m "Update GT7 Relativa rating study"
            git push
          fi
