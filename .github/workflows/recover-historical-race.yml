name: Recover Historical GT7 Race

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-historical-race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Recover historical Daily Race C
        run: |
          python src/recover_historical_race.py

      - name: Save historical recovery result
        run: |
          git config user.name "GT7 Daily Race Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/historical_recovery/

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Recover historical GT7 Daily Race C result"
            git push
          fi