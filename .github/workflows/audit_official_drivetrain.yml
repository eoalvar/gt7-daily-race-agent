name: GT7 Audit Official Drivetrain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-drivetrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Audit official GT7 drivetrain
        run: python src/audit_official_drivetrain.py

      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/official_drivetrain_audit.txt
          git add data/official_drivetrain_audit.json

          if git diff --cached --quiet; then
            echo "No drivetrain audit changes."
          else
            git commit -m "Audit GT7 drivetrains against official car list"
            git push
          fi