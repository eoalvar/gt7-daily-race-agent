name: GT7 Remove Current Week History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-current-week:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove current week from finalized history
        run: python src/remove_current_week_from_final_history.py

      - name: Commit cleaned history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/weekly_rating_history.json
          git add data/remove_current_week_history.txt

          if git diff --cached --quiet; then
            echo "No current-week finalized record found."
          else
            git commit -m "Remove current GT7 week from finalized history"
            git push
          fi