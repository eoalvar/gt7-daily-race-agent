name: GT7 Audit Forecast History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast-history-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit forecast history
        run: python src/audit_forecast_history.py

      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forecast_history_audit.txt
          git add data/forecast_history_audit.json

          if git diff --cached --quiet; then
            echo "No forecast audit changes."
          else
            git commit -m "Audit GT7 forecast history"
            git push
          fi