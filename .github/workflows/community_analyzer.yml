name: GT7 Community Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gt7-community-intelligence
  cancel-in-progress: false

jobs:
  community-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Synchronize repository before processing
        shell: bash
        run: |
          set -e

          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Run community source collector
        run: |
          python community_collector.py

      - name: Run community transcript collector
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          python community_transcripts.py

      - name: Run community analyzer
        run: |
          python community_analyzer.py

      - name: Validate community outputs
        shell: bash
        run: |
          set -e

          echo "===================================================================================================="
          echo "VALIDATING COMMUNITY INTELLIGENCE OUTPUTS"
          echo "===================================================================================================="

          REQUIRED_FILES=(
            "data/community_sources.json"
            "data/community_transcripts.json"
            "data/community_intelligence/community_intelligence.json"
            "data/community_intelligence/community_intelligence.txt"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required file not found: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          required_json = [
              Path("data/community_sources.json"),
              Path("data/community_transcripts.json"),
              Path("data/community_intelligence/community_intelligence.json"),
          ]

          for path in required_json:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)

              print(f"Valid JSON: {path}")

          report = Path(
              "data/community_intelligence/community_intelligence.txt"
          )

          if report.stat().st_size == 0:
              raise RuntimeError(
                  "Community intelligence text report is empty."
              )

          print(
              f"Valid report: {report} "
              f"({report.stat().st_size:,} bytes)"
          )
          PY

      - name: Show final community intelligence summary
        shell: bash
        run: |
          echo "===================================================================================================="
          echo "GT7 COMMUNITY INTELLIGENCE OUTPUT"
          echo "===================================================================================================="

          if [ -f data/community_intelligence/community_intelligence.txt ]; then
            cat data/community_intelligence/community_intelligence.txt
          else
            echo "Community intelligence report not found."
            exit 1
          fi

      - name: Commit all generated community data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/community_sources.json
          git add data/community_transcripts.json
          git add data/community_transcripts/
          git add data/community_transcripts_raw/
          git add data/community_intelligence/

          if git diff --cached --quiet; then
            echo "No community intelligence changes to commit."
            exit 0
          fi

          git commit -m "Update GT7 community intelligence"

          echo "Synchronizing with remote main before final push..."

          git pull --rebase origin main

          git push origin HEAD:main

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "===================================================================================================="
          echo "GT7 COMMUNITY INTELLIGENCE WORKFLOW COMPLETE"
          echo "===================================================================================================="