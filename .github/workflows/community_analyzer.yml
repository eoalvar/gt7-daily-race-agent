name: GT7 Community Analyzer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gt7-community-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run community analyzer
        run: python community_analyzer.py

      - name: Commit community intelligence
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/community_intelligence/community_intelligence.json
          git add data/community_intelligence/community_intelligence.txt

          if git diff --cached --quiet; then
            echo "No community intelligence changes to commit."
            exit 0
          fi

          git commit -m "Update GT7 community intelligence"

          echo "Synchronizing with remote main before push..."
          git pull --rebase origin main

          git push origin HEAD:main