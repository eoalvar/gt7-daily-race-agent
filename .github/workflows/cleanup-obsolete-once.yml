name: GT7 One-Time Obsolete Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove only residual Brake Bias code
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          report_path = Path('reports/latest.txt')
          report_before = report_path.read_bytes() if report_path.exists() else b''
          report_hash_before = hashlib.sha256(report_before).hexdigest()

          detector_path = Path('src/test_race_detector.py')
          text = detector_path.read_text(encoding='utf-8')

          # Protect the current Daily C output contract. These are production features,
          # NOT Brake Bias and must survive this cleanup.
          protected_detector_tokens = [
              'WHAT THE META IS - TOP 5 USED IN TOP 1000',
              'top5_used_cars',
              'CAR OVERPERFORMANCE INDEX',
              'YOUR CAR VS META',
              'FORECAST TO SUNDAY - V2',
              'DATA QUALITY / HEALTH',
          ]
          missing_before = [t for t in protected_detector_tokens if t not in text]
          if missing_before:
              raise SystemExit(f'Protected production tokens missing before cleanup: {missing_before}')

          # get_car_layout is used only by the Brake Bias heuristic in this detector.
          text = text.replace('    get_car_layout\n', '')

          # Remove top-level Brake Bias baseline table.
          text, n_baseline = re.subn(
              r'\n# =+\n# BRAKE BIAS V2\n# =+\n.*?(?=\n# =+\n# BASIC HELPERS\n# =+\n)',
              '\n', text, flags=re.S
          )

          # Remove top-level Brake Bias helper section only.
          text, n_helpers = re.subn(
              r'\n# =+\n# BRAKE BIAS\n# =+\n.*?(?=\n# =+\n# [^\n]+\n# =+\n)',
              '\n', text, count=1, flags=re.S
          )

          # Remove personal Brake Bias state/calculation/snapshot field.
          text = re.sub(r'\n\s*my_brake_bias = None\n', '\n', text)
          text = re.sub(
              r'\n\s*my_brake_bias = brake_bias_recommendation\(\n.*?\n\s*\)\n',
              '\n', text, flags=re.S
          )
          text = re.sub(
              r'\n\s*"my_brake_bias":\n\s*my_brake_bias,\n',
              '\n', text
          )

          # IMPORTANT: keep top5_used_cars. It powers the Meta Top-5 section.
          # Remove only the Brake Bias calculation attached to each Top-5 car.
          text = re.sub(
              r'\n\s*bb = brake_bias_recommendation\(\n\s*car_code,\n\s*tyre_multiplier\n\s*\)\n',
              '\n', text
          )

          # Remove only Brake-Bias-specific fields from each top5_used_cars dict,
          # while keeping car_code, car, count/usage and percentage fields intact.
          text = re.sub(
              r'\n\s*"layout":\n\s*bb\[\n\s*"layout"\n\s*\],\n'
              r'.*?'
              r'\n\s*"wear_adjustment":\n\s*bb\[\n\s*"wear_adjustment"\n\s*\]\n',
              '\n', text, flags=re.S
          )

          # Remove only the report-output Brake Bias section(s), not the Meta section.
          text = re.sub(
              r'\n    # =+\n    # BRAKE BIAS\n    # =+\n.*?(?=\n    # =+\n    # [^\n]+\n    # =+\n)',
              '\n', text, flags=re.S
          )

          forbidden = [
              'BRAKE_BIAS_BASELINES',
              'brake_bias_recommendation',
              'my_brake_bias',
              'YOUR BRAKE BIAS STARTING POINT',
              'BRAKE BIAS - TOP 5 USED CARS',
              'get_car_layout',
          ]
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit(f'Residual Brake Bias tokens remain in detector: {leftovers}')

          # Verify every protected production feature still exists after cleanup.
          missing_after = [t for t in protected_detector_tokens if t not in text]
          if missing_after:
              raise SystemExit(f'Cleanup would remove production output: {missing_after}')

          if n_baseline != 1 or n_helpers != 1:
              raise SystemExit(
                  f'Unexpected Brake Bias section counts: baseline={n_baseline}, helpers={n_helpers}'
              )

          detector_path.write_text(text, encoding='utf-8')

          # Formatter currently strips Brake Bias because detector used to generate it.
          # Once generation is removed, remove only that obsolete stripping logic.
          formatter_path = Path('src/format_daily_report_layout.py')
          fmt = formatter_path.read_text(encoding='utf-8')
          fmt = re.sub(r'\nUNWANTED_START = .*?\nUNWANTED_END = .*?\n', '\n', fmt)
          fmt = re.sub(
              r'\ndef remove_unwanted_sections\(text\):\n.*?(?=\ndef move_changed_section\(text\):)',
              '\n', fmt, flags=re.S
          )
          fmt = fmt.replace('    text = remove_unwanted_sections(text)\n', '')
          fmt = re.sub(r'\n\s*"brake_bias_removed":.*?,', '', fmt)
          fmt = re.sub(r'\n\s*"top5_brake_removed":.*?,', '', fmt)
          if 'brake_bias' in fmt.lower() or 'brake bias' in fmt.lower():
              raise SystemExit('Residual Brake Bias references remain in formatter')
          formatter_path.write_text(fmt, encoding='utf-8')

          # Scrub Brake Bias from live snapshot but preserve Top-5 Meta data.
          live = Path('data/latest_snapshot.json')
          if live.exists():
              obj = json.loads(live.read_text(encoding='utf-8'))
              if isinstance(obj, dict):
                  obj.pop('my_brake_bias', None)
                  cars = obj.get('top5_used_cars')
                  if isinstance(cars, list):
                      brake_keys = {
                          'layout', 'qualifying_range', 'race_range',
                          'qualifying_start', 'race_start', 'confidence',
                          'reason', 'wear_adjustment'
                      }
                      for car in cars:
                          if isinstance(car, dict):
                              for key in brake_keys:
                                  car.pop(key, None)
                  live.write_text(
                      json.dumps(obj, indent=2, ensure_ascii=False) + '\n',
                      encoding='utf-8'
                  )

          # This cleanup must not modify the current user-facing report at all.
          report_after = report_path.read_bytes() if report_path.exists() else b''
          report_hash_after = hashlib.sha256(report_after).hexdigest()
          if report_hash_after != report_hash_before:
              raise SystemExit('Current Daily C report changed during cleanup')
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile src/test_race_detector.py src/format_daily_report_layout.py

      - name: Validate protected Daily C report sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path('reports/latest.txt').read_text(encoding='utf-8')
          required = [
              'WHERE YOU ARE',
              'EXPECTED START',
              'DR LAP-TIME BENCHMARKS - FULL LEADERBOARD',
              'WORLD RECORD & BENCHMARKS',
              'WHERE YOU SHOULD AIM',
              'YOUR CAR VS META',
              'WHAT THE META IS - TOP 5 USED IN TOP 1000',
              'CAR OVERPERFORMANCE INDEX',
              'CARS TO TEST THIS WEEK',
              'FORECAST TO SUNDAY - V2',
              'LONG-TERM COMPETITIVE PERFORMANCE',
              'DATA QUALITY / HEALTH',
          ]
          missing = [section for section in required if section not in report]
          if missing:
              raise SystemExit(f'Protected Daily C report sections missing: {missing}')
          print('Daily C report contract: PASSED')
          PY

      - name: Commit cleanup and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "GT7 Daily Race Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-obsolete-once.yml
          git add src/test_race_detector.py src/format_daily_report_layout.py data/latest_snapshot.json
          git commit -m "Remove Brake Bias while preserving Daily C output"
          git pull --rebase origin main
          git push origin HEAD:main
