name: GT7 Unique PSN Last 8 Double Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  double-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run independent double check
        run: python src/unique_psn_last8_doublecheck.py

      - name: Save double-check outputs
        run: |
          git config user.name "GT7 Daily Race Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/unique_psn_last8_doublecheck.json reports/unique_psn_last8_doublecheck.txt
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update last-8 PSN double check"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
