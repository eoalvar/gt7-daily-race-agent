name: Community Transcripts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  community-transcripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run community transcript collector
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          python community_transcripts.py

      - name: Show generated files
        run: |
          echo "=========================================="
          echo "Community transcript files"
          echo "=========================================="

          if [ -d data/community_transcripts ]; then
            find data/community_transcripts -maxdepth 2 -type f -print
          fi

          echo ""
          echo "=========================================="
          echo "Raw transcript files"
          echo "=========================================="

          if [ -d data/community_transcripts_raw ]; then
            find data/community_transcripts_raw -maxdepth 2 -type f -print
          fi

      - name: Commit transcript cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/community_transcripts.json || true
          git add data/community_transcripts || true
          git add data/community_transcripts_raw || true

          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
          else
            git commit -m "Update community transcript cache"
            git push
          fi