name: Community Transcripts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  community-transcripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run community transcript collector
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          python community_transcripts.py

      - name: Show generated transcript files
        if: always()
        run: |
          echo "===================================================================================================="
          echo "Generated community transcript files"
          echo "===================================================================================================="

          if [ -f data/community_transcripts.json ]; then
            echo
            echo "Database:"
            ls -lh data/community_transcripts.json
          else
            echo
            echo "Database not found."
          fi

          if [ -d data/community_transcripts ]; then
            echo
            echo "Processed transcripts:"
            find data/community_transcripts -maxdepth 1 -type f -print
          else
            echo
            echo "Processed transcript directory not found."
          fi

          if [ -d data/community_transcripts_raw ]; then
            echo
            echo "Raw transcripts:"
            find data/community_transcripts_raw -maxdepth 1 -type f -print
          else
            echo
            echo "Raw transcript directory not found."
          fi

      - name: Commit generated transcript data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/community_transcripts.json
          git add data/community_transcripts/
          git add data/community_transcripts_raw/

          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
          else
            git commit -m "Update community transcripts"
            git push
          fi

      - name: Final status
        if: always()
        run: |
          echo "===================================================================================================="
          echo "COMMUNITY TRANSCRIPTS WORKFLOW COMPLETE"
          echo "===================================================================================================="