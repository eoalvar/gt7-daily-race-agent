name: GT7 Rating History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rating history analysis
        run: python src/rating_history.py

      - name: Commit analysis files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/rating_history.txt
          git add data/rating_history_summary.json

          if git diff --cached --quiet; then
            echo "No rating history changes to commit."
          else
            git commit -m "Update GT7 rating history analysis"
            git push
          fi