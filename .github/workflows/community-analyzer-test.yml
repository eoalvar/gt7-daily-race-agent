name: Community Analyzer Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  community-analyzer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run community analyzer
        run: |
          python community_analyzer.py

      - name: Show generated files
        run: |
          echo "=========================================="
          echo "Generated community intelligence files"
          echo "=========================================="

          if [ -d data/community_intelligence ]; then
            find data/community_intelligence -maxdepth 2 -type f -print
          else
            echo "No community intelligence directory found."
          fi

      - name: Commit generated community intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/community_intelligence/

          if git diff --cached --quiet; then
            echo "No community intelligence changes to commit."
          else
            git commit -m "Update GT7 community intelligence"
            git push
          fi