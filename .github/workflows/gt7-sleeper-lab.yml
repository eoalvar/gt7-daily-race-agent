name: GT7 Sleeper Car Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sleeper-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build lightweight full Race C archive catalog
        id: build_archive_catalog
        continue-on-error: true
        run: |
          python src/build_race_c_archive_catalog.py

      - name: Backfill historical Sleeper training data V0.6
        id: run_history_backfill
        if: steps.build_archive_catalog.outcome == 'success'
        continue-on-error: true
        run: |
          python src/sleeper_history_backfill_v05.py

      - name: Run Sleeper Car Lab base model
        id: run_sleeper_lab
        continue-on-error: true
        run: |
          python src/sleeper_car_lab.py

      - name: Run multi-group technical learning layer
        id: run_technical_learning
        if: steps.run_sleeper_lab.outcome == 'success'
        continue-on-error: true
        run: |
          python src/sleeper_technical_learning.py

      - name: Run structural sleeper model
        id: run_structural_sleeper
        if: steps.run_technical_learning.outcome == 'success'
        continue-on-error: true
        run: |
          python src/structural_sleeper_model.py

      - name: Build weekly car recommendation consensus
        id: run_weekly_recommender
        if: steps.run_structural_sleeper.outcome == 'success'
        continue-on-error: true
        run: |
          python src/weekly_car_recommender.py

      - name: Inspect generated files
        if: always()
        run: |
          echo "Generated Sleeper Lab files:"
          find data reports -maxdepth 3 -type f \
            \( -name 'race_c_archive_catalog.json' \
            -o -name 'sleeper_car_index.json' \
            -o -name 'structural_sleeper_index.json' \
            -o -name 'weekly_car_recommendations.json' \
            -o -name 'sleeper_training_history.json' \
            -o -name 'sleeper_car_lab_error.txt' \
            -o -name 'sleeper_history_backfill_error.txt' \
            -o -name 'weekly_car_recommender_error.txt' \
            -o -name 'race_c_archive_catalog.txt' \
            -o -name 'sleeper_car_lab.txt' \
            -o -name 'sleeper_history_backfill.txt' \
            -o -name 'weekly_car_recommendations.txt' \) \
            -print || true

      - name: Save Sleeper Car Lab results
        if: always()
        run: |
          git config user.name "GT7 Sleeper Car Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for file in \
            data/race_c_archive_catalog.json \
            data/bop_lab/sleeper_car_index.json \
            data/bop_lab/structural_sleeper_index.json \
            data/bop_lab/weekly_car_recommendations.json \
            data/bop_lab/sleeper_training_history.json \
            data/bop_lab/sleeper_car_lab_error.txt \
            data/bop_lab/sleeper_history_backfill_error.txt \
            data/bop_lab/weekly_car_recommender_error.txt \
            reports/race_c_archive_catalog.txt \
            reports/sleeper_car_lab.txt \
            reports/sleeper_history_backfill.txt \
            reports/weekly_car_recommendations.txt
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No Sleeper Car Lab changes to save."
          else
            git commit -m "Update GT7 weekly car recommendation data"
            git push
          fi

      - name: Report Sleeper Car Lab failure
        if: steps.build_archive_catalog.outcome == 'failure' || steps.run_history_backfill.outcome == 'failure' || steps.run_sleeper_lab.outcome == 'failure' || steps.run_technical_learning.outcome == 'failure' || steps.run_structural_sleeper.outcome == 'failure' || steps.run_weekly_recommender.outcome == 'failure'
        run: |
          echo "Sleeper Car Lab had a failed stage. Diagnostic files were preserved."
          exit 1
