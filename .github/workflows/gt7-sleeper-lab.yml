name: GT7 Sleeper Car Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sleeper-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Sleeper Car Lab
        id: run_sleeper_lab
        continue-on-error: true
        run: |
          python src/sleeper_car_lab.py

      - name: Save Sleeper Car Lab results
        if: always()
        run: |
          git config user.name "GT7 Sleeper Car Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/bop_lab/sleeper_car_index.json \
            data/bop_lab/sleeper_car_lab_error.txt \
            reports/sleeper_car_lab.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Sleeper Car Lab changes to save."
          else
            git commit -m "Update GT7 Sleeper Car Lab data"
            git push
          fi

      - name: Report Sleeper Car Lab failure
        if: steps.run_sleeper_lab.outcome == 'failure'
        run: |
          echo "Sleeper Car Lab failed. Diagnostic files were preserved."
          exit 1
