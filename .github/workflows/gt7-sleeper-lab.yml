name: GT7 Sleeper Car Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sleeper-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Backfill historical Sleeper training data
        id: run_history_backfill
        continue-on-error: true
        run: |
          python src/sleeper_history_backfill.py

      - name: Run Sleeper Car Lab base model
        id: run_sleeper_lab
        continue-on-error: true
        run: |
          python src/sleeper_car_lab.py

      - name: Run V0.2 technical learning layer
        id: run_technical_learning
        if: steps.run_sleeper_lab.outcome == 'success'
        continue-on-error: true
        run: |
          python src/sleeper_technical_learning.py

      - name: Inspect generated files
        if: always()
        run: |
          echo "Generated Sleeper Lab files:"
          find data/bop_lab reports -maxdepth 2 -type f \
            \( -name 'sleeper_car_index.json' \
            -o -name 'sleeper_training_history.json' \
            -o -name 'sleeper_car_lab_error.txt' \
            -o -name 'sleeper_history_backfill_error.txt' \
            -o -name 'sleeper_car_lab.txt' \
            -o -name 'sleeper_history_backfill.txt' \) \
            -print || true

      - name: Save Sleeper Car Lab results
        if: always()
        run: |
          git config user.name "GT7 Sleeper Car Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for file in \
            data/bop_lab/sleeper_car_index.json \
            data/bop_lab/sleeper_training_history.json \
            data/bop_lab/sleeper_car_lab_error.txt \
            data/bop_lab/sleeper_history_backfill_error.txt \
            reports/sleeper_car_lab.txt \
            reports/sleeper_history_backfill.txt
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No Sleeper Car Lab changes to save."
          else
            git commit -m "Update GT7 Sleeper Car Lab V0.2 data"
            git push
          fi

      - name: Report Sleeper Car Lab failure
        if: steps.run_history_backfill.outcome == 'failure' || steps.run_sleeper_lab.outcome == 'failure' || steps.run_technical_learning.outcome == 'failure'
        run: |
          echo "Sleeper Car Lab V0.2 had a failed stage. Diagnostic files were preserved."
          exit 1
