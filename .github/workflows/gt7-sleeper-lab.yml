name: GT7 Sleeper Car Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sleeper-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Sleeper Car Lab
        id: run_sleeper_lab
        continue-on-error: true
        run: |
          python src/sleeper_car_lab.py

      - name: Inspect generated files
        if: always()
        run: |
          echo "Generated Sleeper Lab files:"
          find data/bop_lab reports -maxdepth 2 -type f \
            \( -name 'sleeper_car_index.json' \
            -o -name 'sleeper_car_lab_error.txt' \
            -o -name 'sleeper_car_lab.txt' \) \
            -print || true

      - name: Save Sleeper Car Lab results
        if: always()
        run: |
          git config user.name "GT7 Sleeper Car Lab"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/bop_lab/sleeper_car_index.json ]; then
            git add data/bop_lab/sleeper_car_index.json
          fi

          if [ -f data/bop_lab/sleeper_car_lab_error.txt ]; then
            git add data/bop_lab/sleeper_car_lab_error.txt
          fi

          if [ -f reports/sleeper_car_lab.txt ]; then
            git add reports/sleeper_car_lab.txt
          fi

          if git diff --cached --quiet; then
            echo "No Sleeper Car Lab changes to save."
          else
            git commit -m "Update GT7 Sleeper Car Lab data"
            git push
          fi

      - name: Report Sleeper Car Lab failure
        if: steps.run_sleeper_lab.outcome == 'failure'
        run: |
          echo "Sleeper Car Lab failed. Diagnostic files were preserved."
          exit 1
