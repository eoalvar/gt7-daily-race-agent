name: Diagnose GTSH leaderboard access

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/diagnose_gtsh_access.py"
      - ".github/workflows/diagnose-gtsh-access.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only diagnostics dependencies
        run: pip install requests beautifulsoup4
      - name: Compare GTSH HTML and pagination endpoint responses
        run: python src/diagnose_gtsh_access.py
